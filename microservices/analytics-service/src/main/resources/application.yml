# analytics-service runs on port 9095.
# Port plan:
#   8080 - monolith
#   9081 - order-service
#   9082 - inventory-service
#   9083 - payment-service
#   9086 - shipping-service
#   9084 - notification-service
#   9085 - analytics-service  (this one)

server:
  port: 8076

spring:
  application:
    name: analytics-service

  kafka:
    bootstrap-servers: localhost:29092

logging:
  level:
    com.orderflow: INFO
    org.apache.kafka: WARN